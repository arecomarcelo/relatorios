# Stack Docker Swarm — Relatórios (antigo SGR, Multi-Aplicação SGA)
#
# Dados de negócio (vendas, estoque, boletos etc.): o Relatórios fala
# diretamente com o Postgres NATIVO do host (banco "sga", live/transacional),
# não com o container oficial_container — usa extra_hosts (host-gateway) para
# alcançar o Postgres do host a partir do container. Isso não muda.
#
# Identidade/permissão (login e menu, desde 27/08/2026): passou a consultar a
# identidade central (schema administracao) no oficial_db — por isso, e só
# por isso, entra também na rede oficial_db_net (conexão dedicada, ver
# apps/auth/central_auth_service.py). O Relatórios não é tratado como as
# demais apps do ecossistema: não tem schema próprio no oficial_db.
#
# Réplica única (replicas: 1): o Relatórios guarda estado de sessão em memória
# do processo (st.session_state) — múltiplas réplicas quebrariam o login.
#
# Imagem publicada no GHCR via scripts/deploy_local.sh (build+push manual,
# sem CI por enquanto). Deploy na VPS: docker stack deploy -c stack.yml relatorios

services:
  web:
    image: ghcr.io/arecomarcelo/relatorios:latest
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      # Encoding UTF-8 forçado: sem isso o logging do Streamlit estoura
      # UnicodeEncodeError (ascii) ao imprimir ✓/acentos ("--- Logging error ---").
      # Corrigido em 09/09/2026 — Realizado em VPS via Hermes Agent.
      LANG: C.UTF-8
      PYTHONIOENCODING: utf-8
    # Volume gravável do Dashboard de Campanhas: o botão "Atualizar Arquivo
    # de Origem" (apps/vendas/campanhas.py) grava aqui — precisa persistir
    # entre deploys (fora da imagem). Diretório na VPS deve existir com
    # permissão de escrita para o appuser do container antes do 1º deploy.
    volumes:
      - /home/deploy/apps/relatorios/data:/app/data
    entrypoint: ["/app/entrypoint.sh"]
    command:
      - "streamlit"
      - "run"
      - "app.py"
      - "--server.port=8112"
      - "--server.address=0.0.0.0"
      - "--server.headless=true"
      - "--browser.gatherUsageStats=false"
      - "--server.enableWebsocketCompression=false"
    extra_hosts:
      - "host-postgres:host-gateway"
    ports:
      - "127.0.0.1:8112:8112"
    networks:
      - traefik_public
      - oficial_db_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      # Fase 6 da auditoria Hostinger (07/10/2026): pico de 7 dias × 1,5.
      resources:
        limits:
          memory: 704M
      update_config:
        parallelism: 1
        delay: 30s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

networks:
  # traefik_public: o Traefik foi removido em 06/10/2026 (auditoria Hostinger, D4), mas a rede
  # continua em uso — o monitor-oficial checa o /health das apps pela rede interna do Swarm
  # (http://<stack>_web:<porta>/health), e dashboard e relatorios só são alcançáveis por ela
  # (não estão na rede monitoring). Não remover.
  traefik_public:
    external: true
  # Rede overlay compartilhada com o Postgres oficial_db (container
  # oficial_container) — usada só pela conexão dedicada de identidade central
  # (apps/auth/central_auth_service.py, OFICIAL_DB_*). A conexão de dados de
  # negócio continua via host-postgres (extra_hosts), sem mudança.
  oficial_db_net:
    external: true
